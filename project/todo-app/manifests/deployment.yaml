apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          emptyDir: {}
      containers:
        - name: todo-app
          image: capscience/todo-app:1.13
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_DIR
              value: /usr/src/app/files
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files

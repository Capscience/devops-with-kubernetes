apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: log-output-claim
      containers:
        - name: log-writer
          image: capscience/log-writer:1.11.1
          env:
            - name: LOG_PATH
              value: "/logs/log.txt"
          volumeMounts:
            - name: shared-logs
              mountPath: /logs
        - name: log-api
          image: capscience/log-api:1.11.1
          env:
            - name: PORT
              value: "3000"
            - name: LOG_PATH
              value: "/logs/log.txt"
            - name: PINGPONG_PATH
              value: "/logs/pingpong.txt"
          volumeMounts:
            - name: shared-logs
              mountPath: /logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: log-output-claim
      containers:
        - name: pingpong
          image: capscience/pingpong:1.11
          env:
            - name: PORT
              value: "3000"
            - name: PINGPONG_PATH
              value: "/logs/pingpong.txt"
          volumeMounts:
            - name: shared-logs
              mountPath: /logs

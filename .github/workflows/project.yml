name: Build and publish the project todo application

on:
  push:
    paths:
      - "project/**"
      - "!project/README.md"

jobs:
  build-publish:
    name: Build and publish all todo-app containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push todo-app container
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:project/todo-app"
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }}

      - name: Build and push todo-backend container
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:project/todo-backend"
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Use right image
        run: |-
          cd project
          kustomize edit set image TODO-APP=capscience/todo-app:${{ github.sha }}
          kustomize edit set image TODO-BACKEND=capscience/todo-backend:${{ github.sha }}

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: "project/kustomization.yaml"
          message: Released new project version ${{ github.sha }}

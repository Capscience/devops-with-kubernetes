name: Build and publish log-output application

on:
  push:
    paths:
      - "log-output/**"
      - "!log-output/README.md"

jobs:
  build-publish:
    name: Build and publish all log-output containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Move to log-output directory
        run: cd log-output

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push log-writer container
        uses: docker/build-push-action@v6
        with:
          context: log-writer/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/log-writer:${{ github.sha }}

      - name: Build and push log-api container
        uses: docker/build-push-action@v6
        with:
          context: log-api/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/log-api:${{ github.sha }}

      - name: Build and push pingpong container
        uses: docker/build-push-action@v6
        with:
          context: pingpong/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pingpong:${{ github.sha }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Use right image
        run: |-
          kustomize edit set image LOG-WRITER capscience/log-writer:$GITHUB_SHA
          kustomize edit set image LOG-API capscience/log-api:$GITHUB_SHA
          kustomize edit set image PINGPONG capscience/pingpong:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: "kustomization.yaml"
          message: Released new log-output version ${{ github.sha }}
